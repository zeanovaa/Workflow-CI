name: CI — Stroke Prediction MLflow Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlflow-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Working directory: $(pwd)"
          echo "Files:"
          ls -la

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 pandas==2.2.3 numpy==2.1.3 \
                      scikit-learn==1.5.2 imbalanced-learn==0.13.0

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "[INFO] Run ID: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install mlflow==2.19.0

      - name: Upload to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          RUN_ID=${{ env.RUN_ID }}
          MODEL_SRC="MLProject/mlruns/0/${RUN_ID}/artifacts/model"

          if [ -d "$MODEL_SRC" ]; then
            mkdir -p artifacts
            cp -r "$MODEL_SRC" artifacts/model_${RUN_ID:0:8}
            git add artifacts/
            git diff --staged --quiet || git commit -m "ci: upload model artifact run ${RUN_ID:0:8} [skip ci]"
            git push origin main
            echo "[INFO] Artifact uploaded to GitHub."
          else
            echo "[WARNING] Model dir not found: $MODEL_SRC"
            find MLProject/mlruns -type f | head -30
          fi

      - name: Build Docker Model
        run: |
          RUN_ID=${{ env.RUN_ID }}
          echo "[INFO] Building Docker image for run: $RUN_ID"
          mlflow models build-docker \
            --model-uri "MLProject/mlruns/0/${RUN_ID}/artifacts/model" \
            --name "stroke-prediction" \
            --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag stroke-prediction \
            ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest
          echo "[INFO] Docker image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest"
