name: CI — Stroke Prediction MLflow Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlflow-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Working directory: $(pwd)"
          echo "Files:"
          ls -la

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 pandas==2.2.3 numpy==2.1.3 \
                      scikit-learn==1.5.2 imbalanced-learn==0.13.0

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          cd MLProject
          RUN_ID=$(cat run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "[INFO] Run ID: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Upload artifact to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          cat > upload_gdrive.py << 'PYEOF'
          import os, json, pickle
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds_info = json.loads(os.environ['GDRIVE_CREDENTIALS'])
          creds = service_account.Credentials.from_service_account_info(
              creds_info,
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          run_id = os.environ.get('RUN_ID', 'unknown')
          model_path = f"MLProject/mlruns/0/{run_id}/artifacts/model/model.pkl"

          if os.path.exists(model_path):
              file_metadata = {'name': f'stroke_model_{run_id[:8]}.pkl'}
              media = MediaFileUpload(model_path, mimetype='application/octet-stream')
              file = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
              print(f"[INFO] Model uploaded to Google Drive. File ID: {file.get('id')}")
          else:
              print(f"[WARNING] Model file not found at {model_path}")
              print("[INFO] Available mlruns:")
              for root, dirs, files in os.walk('MLProject/mlruns'):
                  for f in files:
                      print(os.path.join(root, f))
          PYEOF
          python upload_gdrive.py

      - name: Build Docker Model
        run: |
          cd MLProject
          RUN_ID=${{ env.RUN_ID }}
          echo "[INFO] Building Docker image for run: $RUN_ID"
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "stroke-prediction" \
            --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag stroke-prediction \
            ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest
          echo "[INFO] Docker image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/stroke-prediction:latest"
